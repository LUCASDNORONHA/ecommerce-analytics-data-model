[project]
name = "ecommerce-analytics-data-model"
version = "0.1.0"
description = "Modelo relacional para análises multidimensionais de e-commerce com dados públicos da Olist."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
