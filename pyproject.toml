[project]
name = "ecommerce-logistics-data-model"
version = "0.1.0"
description = "Modelo relacional para análise de desempenho logístico com dados do e-commerce Olist."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
